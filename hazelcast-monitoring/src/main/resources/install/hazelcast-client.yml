# Native Hazelcast Java client configuration. Edit addresses, cluster and security here.
# Ordinary member multicast servers: use TCP seeds below, or hazelcast-client-member-seed.yml.
hazelcast-client:
  cluster-name: dev
  network:
    cluster-members:
      - 127.0.0.1:5701
