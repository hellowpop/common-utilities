server:
  address: 127.0.0.1
  port: 8085
  tomcat:
    max-http-form-post-size: 2MB
spring:
  application:
    name: http-mock-request-caller
  datasource:
    url: jdbc:h2:file:${caller.data-directory:./data}/db/caller;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${CALLER_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  jdbc:
    template:
      query-timeout: 5s
  mvc:
    async:
      request-timeout: 1800000
caller:
  data-directory: ./data
  max-concurrent-runs: 4
  max-total-workers: 64
  max-response-bytes: 67108864
  script-timeout-millis: 1000
  run-body-budget: 1073741824
  retention-days: 7
